<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Página no encontrada — CatapultaPay</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1.1" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.4rem;
    }
    .error-page img { width: 150px; height: auto; margin-bottom: 1rem; }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 1;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .error-page h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      font-weight: 400;
      color: var(--color-white);
    }
    .error-page p {
      color: var(--color-muted);
      max-width: 420px;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <a href="/"><img src="imagecata.png" alt="CatapultaPay" width="150" height="38" /></a>
    <span class="error-code">404</span>
    <h1>Esta página no existe.</h1>
    <p>El enlace que seguiste puede estar roto o la página fue movida. Regresa al inicio para seguir navegando.</p>
    <a href="/" class="btn-primary">
      Volver al inicio
    </a>
  </div>
</body>
</html>

name: Deploy to IONOS (SFTP)

# Runs automatically on every push to main. To use it:
#
# 1. In IONOS: log in, go to Hosting > (your contract) > "SFTP & SSH" tile >
#    Manage, click your FTP username to see the connection details (server
#    address, username; the password is the one you set for that account).
#    IONOS webhosting now uses SFTP on port 22 by default. If your IONOS
#    account is an older one still on plain FTP/FTPS, change "sftp://" to
#    "ftps://" and the port to 21 in the lftp command below.
#
# 2. In GitHub: this repo > Settings > Secrets and variables > Actions >
#    New repository secret. Add these three (names must match exactly):
#      IONOS_FTP_SERVER    e.g. access123456789.webspace-data.io
#      IONOS_FTP_USERNAME  e.g. u12345678
#      IONOS_FTP_PASSWORD  the password for that FTP/SFTP account
#    Never put these values directly in this file — only in GitHub Secrets.
#
# 3. Remote path confirmed by a one-off diagnostic run: the IONOS account
#    root has a "catapultaPay" folder, and the real site (matching
#    catapultapay.com) lives one level deeper, at catapultaPay/catapultaPay.
#    That is the folder this workflow targets below.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Stage a clean copy (no .git, no dev-only files)
        # Copying to a staging folder first — rather than relying on lftp's
        # --exclude-glob against the live checkout — guarantees .git and
        # other dev files never reach the server, and lets us list exactly
        # what will be uploaded.
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.impeccable' \
            --exclude='tests' \
            --exclude='tools' \
            --exclude='content' \
            --exclude='node_modules' \
            --exclude='*.md' \
            --exclude='preview-server.cjs' \
            --exclude='gallery-redesign.png' \
            --exclude='_deploy' \
            ./ _deploy/
          echo "Files staged for upload:"
          find _deploy -maxdepth 1

      - name: Probe which folder is actually live (temporary diagnostic)
        env:
          IONOS_FTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
          IONOS_FTP_USERNAME: ${{ secrets.IONOS_FTP_USERNAME }}
          IONOS_FTP_PASSWORD: ${{ secrets.IONOS_FTP_PASSWORD }}
        run: |
          echo "probe-root-$(date +%s)" > probe-root.txt
          echo "probe-outer-$(date +%s)" > probe-outer.txt
          echo "probe-inner-$(date +%s)" > probe-inner.txt
          lftp -u "$IONOS_FTP_USERNAME","$IONOS_FTP_PASSWORD" sftp://$IONOS_FTP_SERVER:22 <<'EOF'
          set sftp:auto-confirm yes
          set cmd:fail-exit no
          echo "--- sftp session root ---"
          pwd
          ls -l
          echo "--- absolute / ---"
          cd /
          pwd
          ls -l
          echo "--- /Catapulta (if reachable) ---"
          cd /Catapulta
          pwd
          ls -l
          echo "--- /Catapulta/catapultaPay/catapultaPay (absolute, panel-reported path) ---"
          cd /Catapulta/catapultaPay/catapultaPay
          pwd
          ls -l
          put probe-root.txt -o ionos-probe.txt
          EOF
          true

      - name: Upload to IONOS via SFTP
        env:
          IONOS_FTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
          IONOS_FTP_USERNAME: ${{ secrets.IONOS_FTP_USERNAME }}
          IONOS_FTP_PASSWORD: ${{ secrets.IONOS_FTP_PASSWORD }}
        run: |
          lftp -u "$IONOS_FTP_USERNAME","$IONOS_FTP_PASSWORD" sftp://$IONOS_FTP_SERVER:22 <<'EOF'
          set sftp:auto-confirm yes
          set mirror:parallel-transfer-count 3
          mirror -R --verbose _deploy /catapultaPay/catapultaPay
          EOF
          # Note: no --delete here on purpose, so this never removes files
          # that already exist on IONOS but aren't in this repo. Add
          # --delete to the mirror command above once you've confirmed the
          # upload works and IONOS only has files this repo manages.

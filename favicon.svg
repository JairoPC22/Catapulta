<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 48 48" role="img" aria-labelledby="title desc">
  <title id="title">CatapultaPay</title>
  <desc id="desc">Símbolo diagonal de conexión y pagos de CatapultaPay.</desc>

  <defs>
    <linearGradient id="brand" x1="11" y1="54" x2="54" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ECFAD"/>
      <stop offset="0.52" stop-color="#20C9C4"/>
      <stop offset="1" stop-color="#45C0E8"/>
    </linearGradient>
  </defs>

  <!--
    Evolución fiel del símbolo original:
    un punto de origen y cuatro ondas que se proyectan en diagonal.
    La geometría está ajustada ópticamente para favicons de 16 a 64 px.
  -->
  <g fill="none" stroke="url(#brand)" stroke-linecap="round">
    <path d="M35.3 45.2A10 10 0 0 1 45.3 35.2" stroke-width="4.5"/>
    <path d="M27.1 45.2A18.2 18.2 0 0 1 45.3 27" stroke-width="4.1"/>
    <path d="M18.9 45.2A26.4 26.4 0 0 1 45.3 18.8" stroke-width="3.7"/>
    <path d="M10.7 45.2A34.6 34.6 0 0 1 45.3 10.6" stroke-width="3.3"/>
  </g>

  <circle cx="45.3" cy="45.2" r="4.9" fill="url(#brand)"/>
</svg>
